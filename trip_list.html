<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیست سفرها</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Vazir&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazir', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 90%;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #007BFF;
        }
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            background-color: #fff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 8px;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007BFF;
            color: white;
        }
        td {
            background-color: #f9f9f9;
        }
        .actions a {
            margin: 0 10px;
            color: #007BFF;
            text-decoration: none;
            font-size: 16px;
        }
        .actions a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>لیست سفرها</h1>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>شناسه سفر</th>
                    <th>نام راننده</th>
                    <th>مقصد</th>
                    <th>کرایه</th>
                    <th>زمان شروع</th>
                    <th>اقدامات</th>
                </tr>
            </thead>
            <tbody>
                {% for trip in trips %}
                    <tr>
                        <td>{{ trip.id }}</td>
                        <td>{{ trip.driver_name }}</td>
                        <td>{{ trip.destination }}</td>
                        <td>{{ trip.fare }}</td>
                        <td>{{ trip.start_time }}</td>
                        <td class="actions">
                            <a href="{{ url_for('edit_trip', trip_id=trip.id) }}">ویرایش</a>
                            <a href="{{ url_for('delete_trip', trip_id=trip.id) }}" onclick="return confirm('آیا از حذف این سفر اطمینان دارید؟')">حذف</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
