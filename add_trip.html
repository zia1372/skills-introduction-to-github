<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ثبت سفر جدید</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: 'Vazir', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 500px;
            margin: 60px auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        label {
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            color: #444;
        }
        input, select {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            background-color: #00bcd4;
            color: white;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #00acc1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>ثبت سفر جدید</h2>
        <form method="post" action="/add-trip">
            <label for="driver">انتخاب راننده:</label>
            <select name="driver_id" id="driver" required>
                {% for driver in drivers %}
                    <option value="{{ driver.id }}">{{ driver.first_name }} {{ driver.last_name }} - {{ driver.car_type }} ({{ driver.car_plate }})</option>
                {% endfor %}
            </select>

            <label for="destination">مقصد:</label>
            <input type="text" id="destination" name="destination" placeholder="مثلاً حرم مطهر" required>

            <label for="price">مبلغ (تومان):</label>
            <input type="number" id="price" name="price" placeholder="مثلاً ۵۰۰۰۰" required>

            <button type="submit" class="btn">ثبت سفر</button>
        </form>
    </div>
</body>
</html>
