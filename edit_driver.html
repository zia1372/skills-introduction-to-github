<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ویرایش راننده</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Vazir, sans-serif;
            background-color: #f4f8fb;
            padding: 30px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #007bff;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="file"],
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .form-img-preview {
            margin-top: 15px;
            text-align: center;
        }
        .form-img-preview img {
            max-width: 200px;
            border-radius: 10px;
            border: 2px solid #ccc;
        }
        button {
            margin-top: 20px;
            width: 100%;
            background-color: #00a8ff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #007acc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>ویرایش اطلاعات راننده</h2>
        <form method="POST" enctype="multipart/form-data">
            <label>نام:</label>
            <input type="text" name="name" value="{{ driver['name'] }}" required>

            <label>نام خانوادگی:</label>
            <input type="text" name="family" value="{{ driver['family'] }}" required>

            <label>کد ملی:</label>
            <input type="text" name="national_code" value="{{ driver['national_code'] }}" required>

            <label>شماره تماس:</label>
            <input type="tel" name="phone" value="{{ driver['phone'] }}" required>

            <label>نوع خودرو:</label>
            <input type="text" name="car_model" value="{{ driver['car_model'] }}" required>

            <label>پلاک:</label>
            <input type="text" name="license_plate" value="{{ driver['license_plate'] }}" required>

            <label>تصویر جدید (اختیاری):</label>
            <input type="file" name="image" accept="image/*">

            <div class="form-img-preview">
                <p>تصویر فعلی:</p>
                {% if driver['image_path'] %}
                    <img src="{{ url_for('static', filename='uploads/' ~ driver['image_path']) }}" alt="Driver Photo">
                {% else %}
                    <p>بدون تصویر</p>
                {% endif %}
            </div>

            <button type="submit">ذخیره تغییرات</button>
        </form>
    </div>
</body>
</html>
