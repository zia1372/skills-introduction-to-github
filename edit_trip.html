<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویرایش سفر</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Vazir&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>ویرایش سفر</h1>
    <form method="POST">
        <div>
            <label for="destination">مقصد:</label>
            <input type="text" id="destination" name="destination" value="{{ trip.destination }}" required>
        </div>
        <div>
            <label for="fare">کرایه:</label>
            <input type="number" id="fare" name="fare" value="{{ trip.fare }}" required>
        </div>
        <div>
            <label for="start_time">زمان شروع:</label>
            <input type="datetime-local" id="start_time" name="start_time" value="{{ trip.start_time }}" required>
        </div>
        <button type="submit">ذخیره تغییرات</button>
    </form>
</div>

</body>
</html>
